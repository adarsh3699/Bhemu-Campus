packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@firebase/util": true
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.10 || 57.0.17'
  - "@expo/config-plugins@57.0.6"
  - "@expo/config@57.0.6"
  - '@expo/fingerprint@0.20.6 || 0.20.9'
  - "@expo/image-utils@0.11.4"
  - '@expo/metro-config@57.0.7 || 57.0.9'
  - '@expo/metro-runtime@57.0.7 || 57.0.12'
  - '@expo/prebuild-config@57.0.9 || 57.0.13'
  - "@expo/require-utils@57.0.4"
  - '@expo/router-server@57.0.4 || 57.0.7'
  - babel-preset-expo@57.0.4
  - expo-asset@57.0.7 || 57.0.13
  - expo-constants@57.0.7 || 57.0.13
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7 || 57.0.12
  - expo-modules-jsi@57.0.4 || 57.0.5
  - expo@57.0.8 || 57.0.15
  - expo-auth-session@57.0.5
  - expo-linking@57.0.4 || 57.0.7
  - expo-router@57.0.8 || 57.0.15
  - expo-splash-screen@57.0.5
  - expo-web-browser@57.0.2
  - expo-dev-client@57.0.8 || 57.0.14
  - expo-dev-launcher@57.0.8 || 57.0.14
  - expo-dev-menu@57.0.8 || 57.0.14
  - miniflare@5.20260801.0-alpha || 5.20260801.1-alpha
  - wrangler@4.119.0 || 4.120.0
  - '@expo/local-build-cache-provider@57.0.7'
  - expo-file-system@57.0.5
  - '@expo/ui@57.0.12'
  - expo-notifications@57.0.13
  - expo-updates@57.0.16

patchedDependencies:
  # Retain the Android UMS integration on Expo SDK 57's recommended version.
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch
